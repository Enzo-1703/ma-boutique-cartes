<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Contact - Cartes & Merveilles</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Cartes & Merveilles ✨</h1>
    <nav>
      <a href="index.html">Accueil</a> |
      <a href="unite.html">Cartes à l’unité</a> |
      <a href="lots.html">Lots de cartes</a> |
      <a href="contact.html">Contact</a>
    </nav>
  </header>

  <main>
    <h2>Nous contacter 📬</h2>
    <p>Une question ? Un partenariat ? Écris-nous !</p>

    <div class="contact-container">
      <form action="https://formspree.io/f/moqgrzrl" method="POST">
        <label for="name">Nom :</label>
        <input type="text" id="name" name="name" required>

        <label for="email">Email :</label>
        <input type="email" id="email" name="email" required>

        <label for="message">Message :</label>
        <textarea id="message" name="message" rows="5" required></textarea>

        <button type="submit">Envoyer</button>
      </form>

      <div class="contact-info">
        <h3>Nos coordonnées</h3>
        <p>📍 42 Rue de l’Imaginaire, 75000 Paris</p>
        <p>📞 01 23 45 67 89</p>
        <p>📧 contact@cartes-merveilles.fr</p>
      </div>
    </div>
  </main>

  <footer>
    <p>&copy; 2025 Cartes & Merveilles</p>
  </footer>
</body>
</html>
